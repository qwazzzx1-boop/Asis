name: Build Android APK

on:
  push:
    branches: [ main, master, echo-stability-fix ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git ccache python3-dev python3-pip python3-setuptools \
            zip unzip zlib1g-dev libncurses5-dev libncursesw5-dev autoconf \
            automake libtool pkg-config libffi-dev libssl-dev cmake

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools
          pip install "Cython==0.29.33" virtualenv
          pip install buildozer

      - name: Build APK
        run: buildozer android debug

      - name: Diagnose generated Android manifest
        if: failure()
        run: |
          echo "=== Generated AndroidManifest.xml files ==="
          find .buildozer -type f -name AndroidManifest.xml -print
          python - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          paths = glob.glob(".buildozer/**/AndroidManifest.xml", recursive=True)
          if not paths:
              print("No generated AndroidManifest.xml found.")
          for path in paths:
              print(f"\\n===== {path} =====")
              try:
                  ET.parse(path)
                  print("XML syntax: valid")
              except ET.ParseError as exc:
                  print(f"XML syntax error: {exc}")
              with open(path, encoding="utf-8", errors="replace") as f:
                  for number, line in enumerate(f, 1):
                      print(f"{number:04}: {line.rstrip()}")
          PY

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceAssistant-Debug-APK
          path: bin/*.apk
          retention-days: 14
